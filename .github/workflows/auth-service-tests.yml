name: Auth Service Tests

on:
  push:
    branches: [ main, develop, "feature/*" ]
    paths:
      - 'backend/packages/auth-service/**'
      - '.github/workflows/auth-service-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/packages/auth-service/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client libpq-dev

    - name: Install Python dependencies
      working-directory: backend/packages/auth-service
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements-test.txt

    - name: Lint with flake8
      working-directory: backend/packages/auth-service
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 app tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Type checking with mypy
      working-directory: backend/packages/auth-service
      continue-on-error: true
      run: |
        mypy app --ignore-missing-imports

    - name: Run unit tests
      working-directory: backend/packages/auth-service
      run: |
        pytest tests/unit -v --tb=short

    - name: Run integration tests
      working-directory: backend/packages/auth-service
      run: |
        pytest tests/integration -v --tb=short

    - name: Run contract tests
      working-directory: backend/packages/auth-service
      run: |
        pytest tests/contract -v --tb=short

    - name: Run all tests with coverage
      working-directory: backend/packages/auth-service
      run: |
        pytest tests/ --cov=app --cov-report=xml --cov-report=html --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./backend/packages/auth-service/coverage.xml
        flags: auth-service
        name: auth-service-coverage
        fail_ci_if_error: false

    - name: Upload coverage report as artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: backend/packages/auth-service/htmlcov/
        retention-days: 30

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: backend/packages/auth-service/.pytest_cache/
        retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    if: success()

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./backend/packages/auth-service/Dockerfile
        push: false
        tags: formacionia-auth-service:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  security-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: 'backend/packages/auth-service'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
