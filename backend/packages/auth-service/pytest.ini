[pytest]
# Pytest configuration for Auth Service

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Asyncio mode (for pytest-asyncio)
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (with database/Redis)
    contract: Contract tests (API specification)
    slow: Slow tests (>1 second)
    security: Security-related tests

# Coverage
addopts =
    --strict-markers
    --tb=short
    -ra

# Minimum coverage
# Uncomment to enforce coverage requirements
# --cov=app
# --cov-fail-under=85

# Output
log_cli = false
log_cli_level = INFO
log_file = tests.log
